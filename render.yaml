services:
  - type: web
    name: paysift-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOSTED_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: CORS_ORIGINS
        sync: false
      - key: YDC_API_KEY
        sync: false
